[project]
name = "colibri-intelligence"
version = "2.0.0"
description = "Sistema de IA de producción: RAG híbrido + agentes con supervisor + API FastAPI + trazas en Arize Phoenix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-redis>=0.6",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=4.5",
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "langchain-community>=0.4",
    "langchain-classic>=1.0",
    "langchain-text-splitters>=1.0",
    "rank-bm25>=0.2",
    "tiktoken>=0.8",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-langchain>=0.1.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.20", "nbclient>=0.10", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["app", "app.agents", "app.rag"]
