# Colibrí Intelligence: todo el sistema con una sola instrucción
#
#   docker compose up -d --build      (o ./run.sh, que además espera a que la API esté sana)
#
# Orden de arranque: redis + chroma + phoenix -> ingesta (corre una vez y termina) -> api + worker
#   API y documentación:  http://localhost:8000/docs
#   Trazas (Phoenix):     http://localhost:6006
services:
  redis:
    # Redis Stack trae RedisJSON y RediSearch, que usa langgraph-checkpoint-redis para guardar los checkpoints
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    # La base vectorial como servidor: la ingesta escribe y la API y los workers leen de la misma colección.
    # La versión coincide con la del cliente chromadb de requirements.txt.
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # interfaz web + colector OTLP por HTTP (/v1/traces)
      - "4317:4317"   # colector OTLP por gRPC
    volumes:
      - phoenix-data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      # Phoenix trae autenticación activada por defecto: en local la apagamos para que el colector acepte
      # las trazas sin API key. En un despliegue real se deja activada y se usa PHOENIX_API_KEY.
      - PHOENIX_ENABLE_AUTH=false
      - PHOENIX_TELEMETRY_ENABLED=false

  ingesta:
    # Sincroniza data/conocimiento con Chroma (incremental: si nada cambió, no gasta embeddings) y termina
    build: .
    command: ["python", "-m", "app.rag.ingesta"]
    env_file: .env
    environment: &servicios
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      chroma:
        condition: service_started
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *servicios
      WORKERS: "0"          # la API solo recibe pedidos; el trabajo lo hace el servicio worker
    depends_on: &dependencias
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
      ingesta:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: ["python", "-m", "app.worker", "--workers", "3"]
    env_file: .env
    environment: *servicios
    depends_on: *dependencias

volumes:
  redis-data:
  chroma-data:
  phoenix-data:
